site_name: "PrivaLens - Automated Web Privacy & Regulatory Compliance Scanner"
site_url: https://NamanArora2709.github.io/ucs503p-202627-privalens

plugins:
- search
- literate-nav:
    nav_file: summary.md
- section-index
- git-revision-date-localized
- git-authors
- mkdocstrings:
    handlers:
      python:
        paths: [src]
        options:
          summary: true
          show_symbol_type_heading: true
          show_symbol_type_toc: true
          show_root_full_path: true
          show_root_heading: true
          show_source: false

theme:
  name: material
  custom_dir: docs/assets/theme-overrides
  features:
    - navigation.footer
    - header.autohide
    - content.tabs.link
    - navigation.tracking
    - navigation.top
    - toc.integrate
    - content.tooltips
  icon:
    repo: fontawesome/brands/github
    annotation: material/plus-circle-outline
  palette:
    primary: indigo
    accent: blue
  logo: assets/tiet-logo.svg
  favicon: assets/favicon.png

repo_url: https://github.com/NamanArora2709/ucs503p-202627-privalens
repo_name: ucs503p-202627-privalens
copyright: "Copyright &copy; 2026 Naman Arora, Prabhrajwin Singh, Ishmanjot Singh • UCS503 Software Engineering"
extra:
  social:
  - icon: fontawesome/brands/github
    link: https://github.com/NamanArora2709/ucs503p-202627-privalens
    name: Git Repo for PrivaLens

extra_css:
  - assets/stylesheets/extra.css
  - https://unpkg.com/katex@0/dist/katex.min.css

extra_javascript:
- https://unpkg.com/katex@0/dist/katex.min.js
- javascript/arithmatex.js

markdown_extensions:
  - abbr
  - md_in_html
  - attr_list
  - toc:
      permalink: true
  - footnotes
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite:
      custom_inline:
        - name: math
          class: arithmatex
          format: !!python/object/apply:pymdownx.arithmatex.arithmatex_inline_format {which: generic}
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: math
          class: arithmatex
          arithmatex: !!python/object/apply:pymdownx.arithmatex.arithmatex_fenced_format {which: generic}
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - toc:
      toc_depth: 4
  - sane_lists
